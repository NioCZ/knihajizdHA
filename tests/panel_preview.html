<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kniha jízd – panel preview</title>
    <style>
      :root {
        --primary-background-color: #f4f6f8;
        --card-background-color: #fff;
        --secondary-background-color: #edf1f4;
        --primary-text-color: #17212b;
        --secondary-text-color: #63707d;
        --text-primary-color: #fff;
        --primary-color: #087ea4;
        --divider-color: #dce2e7;
        --success-color: #267447;
        --warning-color: #c76200;
        --error-color: #bd2020;
        --ha-card-box-shadow: 0 2px 10px rgba(20, 35, 50, .09);
      }
      html, body { margin: 0; min-height: 100%; background: var(--primary-background-color); }
    </style>
  </head>
  <body>
    <kniha-jizd-panel></kniha-jizd-panel>
    <script type="module">
      import "../custom_components/kniha_jizd/frontend/kniha-jizd-panel.js";

      const pendingTrip = {
        id: "preview-pending",
        started_at: "2026-09-01T07:18:00+02:00",
        ended_at: "2026-09-01T07:24:00+02:00",
        start_address: "Vrchlického 699, Kroměříž",
        end_address: "Mořice 192, Mořice",
        distance_km: 17,
        purpose: "",
        trip_type: "unclassified",
        status: "waiting_classification",
        editable: true,
        odometer_ready: true,
        needs_review: false,
        decision: {
          source_label: "Krátká zastávka",
          explanation: "Odjezd pokračoval ze stejného místa po krátké pauze.",
          confidence: "review",
          source: "pending_reconsidered_on_continuation",
        },
        question: {
          kind: "short_stop",
          title: "Byla krátká zastávka samostatným cílem?",
          prompt: "Zastavení Mořice 192 vypadalo jako mezizastávka, ale cesta zatím nepokračovala.",
          phone_state: "panel_only",
          actions: [
            { id: "business", label: "Služební bez klienta" },
            { id: "new", label: "Jiný klient / účel", requires_value: true },
            { id: "private", label: "Soukromá" },
          ],
        },
      };
      const savedTrip = {
        id: "preview-saved",
        started_at: "2026-09-01T08:00:00+02:00",
        ended_at: "2026-09-01T10:10:00+02:00",
        start_address: "Mořice 192, Mořice",
        end_address: "Vídeňská 817/7, Praha 4-Krč",
        distance_km: 244,
        purpose: "Thomayerova nemocnice",
        trip_type: "business",
        status: "saved",
        editable: true,
        odometer_ready: true,
        needs_review: false,
        distance_reconciliation_source: "odometer_anchor_exact_whole_km",
        decision: {
          source_label: "Známé služební místo",
          explanation: "Cíl odpovídá uloženému místu Thomayerova nemocnice.",
          confidence: "high",
          source: "learned_place",
          matched_place_id: "hospital",
          matched_place_label: "Thomayerova nemocnice",
          distance_m: 48,
          radius_m: 500,
          match_method: "gps",
        },
      };
      const overview = {
        status: "waiting_classification",
        ready: true,
        statistics: {
          today_business_km: 244,
          today_private_km: 0,
          today_segments: 2,
          segments_total: 38,
          business_km_total: 2840,
          private_km_total: 123,
        },
        diagnostics: {
          trigger_ok: true,
          gps_ok: true,
          address_ok: true,
          odometer_ok: true,
          notify_ok: true,
          trigger_entity: "binary_sensor.android_auto",
          trigger_state: "off",
          gps_entity: "device_tracker.telefon",
          latitude: 50.0255,
          longitude: 14.4603,
          gps_coordinate_source: "gps_entity:latitude_longitude",
          address_entity: "sensor.telefon_geocoded_location",
          odometer_entity: "sensor.skoda_odometer",
          odometer_km: 100259,
          odometer_value_source: "state",
          closing_count: 0,
          pending_count: 1,
          transient_count: 0,
          review_count: 0,
          today_review_count: 0,
          return_context_hours: 18,
          transient_stop_minutes: 60,
          pending_review_hours: 24,
          location_settle_seconds: 60,
          home_address: "Vrchlického 699, Kroměříž",
          company_address: "Na Jetelce 69, Praha 9",
          company_label: "Firma",
          home_radius_m: 300,
          company_radius_m: 300,
          client_radius_m: 500,
          private_radius_m: 250,
          transient_radius_m: 200,
          odometer_day_check: { consistent: true, odometer_delta_km: 261, assigned_segment_km: 261, pending_segment_km: 0, difference_km: 0 },
          today_trips: [pendingTrip, savedTrip],
        },
        last_trip: { ...savedTrip, journey_distance_km: 244, journey_segment_count: 1 },
        export: { state: "never" },
      };
      const hass = {
        states: {
          "sensor.kniha_jizd_stav": { state: "waiting_classification", attributes: { kniha_jizd_kind: "status" } },
          "binary_sensor.kniha_jizd_pripravena": { state: "on", attributes: { kniha_jizd_kind: "ready" } },
        },
        async callApi(method, path) {
          if (method === "GET" && path === "kniha_jizd/overview") return structuredClone(overview);
          if (method === "GET" && path.startsWith("kniha_jizd/history")) {
            return { rows: structuredClone(overview.diagnostics.today_trips), days: [], month_business_km: 244, month_private_km: 0, month_trips: 2 };
          }
          if (method === "GET" && path === "kniha_jizd/map") return { generated_at: new Date().toISOString(), configured_places: [], learned_places: [], today_routes: [], car: {} };
          if (method === "GET" && path === "kniha_jizd/places") return { places: [], configured_places: [], radii: {} };
          return {};
        },
        async callService(domain, service, data) {
          if (domain === "kniha_jizd" && service === "resolve_trip") {
            pendingTrip.question = null;
            pendingTrip.status = "saved";
            pendingTrip.trip_type = data.action === "private" ? "private" : "business";
            pendingTrip.purpose = data.value || (data.action === "private" ? "Soukromá" : "");
            overview.diagnostics.pending_count = 0;
            overview.status = "idle";
          }
        },
      };
      const panel = document.querySelector("kniha-jizd-panel");
      panel.hass = hass;
    </script>
  </body>
</html>
