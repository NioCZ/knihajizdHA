export_excel:
  name: Exportovat do Excelu
  description: Vytvoří Excel se souhrnem a raw segmenty z vybraného měsíce.
  fields:
    month:
      name: Měsíc
      description: Měsíc reportu ve formátu YYYY-MM. Výchozí je aktuální měsíc.
      required: false
      example: "2026-08"
      selector:
        text:
    path:
      name: Cesta
      description: Relativní cesta uvnitř /config nebo absolutní cesta uvnitř /config.
      required: false
      default: kniha_jizd.xlsx
      example: kniha_jizd.xlsx
      selector:
        text:
