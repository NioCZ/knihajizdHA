export_excel:
  name: Exportovat do Excelu
  description: Vytvoří Excel se souhrnem a raw segmenty z vybraného měsíce.
  fields:
    month:
      name: Měsíc
      description: Měsíc reportu ve formátu YYYY-MM. Výchozí je aktuální měsíc.
      required: false
      example: "2026-08"
      selector:
        text:
    path:
      name: Cesta
      description: Relativní cesta uvnitř /config nebo absolutní cesta uvnitř /config.
      required: false
      default: kniha_jizd.xlsx
      example: kniha_jizd.xlsx
      selector:
        text:
update_trip:
  name: Upravit jízdu
  description: Opraví uloženou nebo čekající jízdu; u řetězce upraví všechny jeho segmenty.
  fields:
    segment_id:
      name: ID segmentu
      required: true
      selector:
        text:
    purpose:
      name: Účel / zákazník
      description: Volitelné. Prázdná služební jízda se uloží bez zákazníka; soukromá dostane interní účel Soukromá.
      required: false
      selector:
        text:
    trip_type:
      name: Typ jízdy
      required: true
      selector:
        select:
          options:
            - label: Služební
              value: business
            - label: Soukromá
              value: private
    start_address:
      name: Místo odjezdu
      required: false
      selector:
        text:
    end_address:
      name: Místo příjezdu
      required: false
      selector:
        text:
    distance_km:
      name: Kilometry
      description: Volitelná ruční oprava délky konkrétního segmentu.
      required: false
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: km
resolve_trip:
  name: Odpovědět na dotaz k jízdě
  description: Zařadí čekající jízdu; uložení cíle jako místa je samostatný krok.
  fields:
    segment_id:
      name: ID segmentu
      required: true
      selector:
        text:
    action:
      name: Rozhodnutí
      required: true
      selector:
        select:
          options:
            - label: Služební
              value: business
            - label: Soukromá
              value: private
            - label: Služební návrat
              value: return
    value:
      name: Klient nebo účel
      description: Volitelný zákazník nebo účel služební jízdy.
      required: false
      selector:
        text:
    candidate_index:
      name: Číslo návrhu
      description: Volitelná volba jednoho z mapových návrhů 1 až 3.
      required: false
      selector:
        number:
          min: 1
          max: 3
          step: 1
save_trip_place:
  name: Uložit cíl jako místo
  description: Samostatně uloží cíl už zařazené jízdy pro automatické rozpoznání, nebo nabídku odmítne.
  fields:
    segment_id:
      name: ID segmentu
      required: true
      selector:
        text:
    action:
      name: Rozhodnutí
      required: true
      selector:
        select:
          options:
            - label: Uložit místo
              value: save
            - label: Jen tentokrát
              value: skip
    value:
      name: Název místa
      description: Volitelný vlastní název; bez něj se použije zobrazený návrh.
      required: false
      selector:
        text:
